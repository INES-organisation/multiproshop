global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'multiproshop-monitor'

scrape_configs:
  - job_name: 'multiproshop'
    static_configs:
      - targets: ['host.docker.internal:5000']
    metrics_path: '/prometheus/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
