{% extends 'layout.html' %}

{% block content %}
<div class="container" style="max-width: 480px; padding: 3rem 1rem;">
    <div class="card-modern">
        <div class="card-modern-body">
            <h1 style="font-size: 1.6rem; font-weight: 800;">Nouveau mot de passe</h1>
            <p class="text-muted">8 caractères minimum.</p>
            <form method="post">
                <div class="mb-3">
                    <label for="password" class="form-label">Nouveau mot de passe</label>
                    <input type="password" id="password" name="password" class="form-control-modern" minlength="8" autocomplete="new-password" required>
                </div>
                <div class="mb-3">
                    <label for="password_confirm" class="form-label">Confirmez le mot de passe</label>
                    <input type="password" id="password_confirm" name="password_confirm" class="form-control-modern" minlength="8" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn-modern btn-modern-primary w-100 btn-modern-lg">Enregistrer</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
