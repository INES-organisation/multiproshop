{% extends "layout.html" %}

{% block title %}Page non trouvée - MultiProShop{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="error-page">
                <h1 class="display-1 fw-bold text-primary">404</h1>
                <h2 class="mb-4">Page non trouvée</h2>
                <p class="lead mb-4">
                    Désolé, la page que vous recherchez n'existe pas ou a été déplacée.
                </p>
                
                <div class="mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" fill="currentColor" class="bi bi-search text-muted" viewBox="0 0 16 16">
                        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                    </svg>
                </div>
                
                <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg px-4 gap-3">
                        <i class="fas fa-home me-2"></i>Retour à l'accueil
                    </a>
                    <a href="{{ url_for('products.list_products') }}" class="btn btn-outline-secondary btn-lg px-4">
                        <i class="fas fa-shopping-bag me-2"></i>Voir les produits
                    </a>
                </div>
                
                <div class="mt-5">
                    <p class="text-muted">
                        Besoin d'aide ? <a href="{{ url_for('main.index') }}#contact">Contactez-nous</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.error-page {
    padding: 3rem 0;
}

.error-page h1 {
    font-size: 8rem;
    line-height: 1;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
}

@media (max-width: 768px) {
    .error-page h1 {
        font-size: 5rem;
    }
}
</style>
{% endblock %}
