# À ajouter dans monitoring/nginx/nginx.conf du dépôt INES (bloc http), AVANT le vhost
# « domaines personnalisés », comme le bloc de Digita. Un server_name exact est prioritaire
# sur la regex catch-all : INES et les autres domaines ne sont pas touchés.
# Le certificat est posé par : bash scripts/add-custom-domain.sh multiproshop.com

    server {
        listen 80;
        server_name multiproshop.com www.multiproshop.com;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://multiproshop.com$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name multiproshop.com www.multiproshop.com;

        ssl_certificate     /etc/nginx/certs/domains/multiproshop.com.crt;
        ssl_certificate_key /etc/nginx/certs/domains/multiproshop.com.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        client_max_body_size 20M;

        # www → domaine nu
        if ($host = www.multiproshop.com) {
            return 301 https://multiproshop.com$request_uri;
        }

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $multiproshop "http://multiproshop-web:8000";

        location /static/ {
            proxy_pass $multiproshop;
            proxy_set_header Host $host;
            expires 30d;
        }

        # Métriques internes : pas d'accès public
        location ~ ^/metrics {
            return 404;
        }

        location / {
            proxy_pass $multiproshop;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
