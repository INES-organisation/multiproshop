[pytest]
# Configuration pytest
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Options par défaut
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers personnalisés
markers =
    slow: tests lents
    integration: tests d'intégration
    unit: tests unitaires
